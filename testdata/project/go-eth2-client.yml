# The attgo settings of go-eth2-client's .golangci.yml, unchanged, next to two
# analyzers registered under their own names (one entry each, no settings).
version: "2"

linters:
  default: none
  enable:
    - attgo
    - sample_first
    - sample_second

  settings:
    custom:
      attgo:
        type: "module"
        description: "Attestant organization style linter"
        settings:
          # HIGH PRIORITY
          enable_no_pkg_logger: false
          enable_enum_iota: true
          enable_current_year: true
          # MEDIUM PRIORITY
          enable_capital_comment: false
          enable_func_opts: true
          enable_raw_string: true
          # LOW PRIORITY
          enable_struct_field_order: false
          enable_interface_check: true

      sample_first:
        type: "module"
        description: "Sample analyzer registered under its own name"
      sample_second:
        type: "module"
        description: "Second sample analyzer registered under its own name"
